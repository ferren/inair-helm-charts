annotations:
  category: CRM
  licenses: Apache-2.0
  images: |
    - name: inair-odoo
      image: registry.cn-shenzhen.aliyuncs.com/inair/inair-odoo:20.0.20261020
apiVersion: v2
appVersion: 20.0.20261020
dependencies:
  - condition: postgresql.enabled
    name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 18.x.x
  - condition: redis.enabled
    name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 28.x.x
  - name: common
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - bitnami-common
    version: 2.x.x
description: Odoo is an open source ERP and CRM platform, formerly known as OpenERP, that can connect a wide variety of business operations such as sales, supply chain, finance, and project management.
engine: gotpl
home: https://github.com/ferren/inair-helm-charts/tree/master/inair/odoo-20
icon: https://bitnami.com/assets/stacks/odoo/img/odoo-stack-220x234.png
keywords:
  - odoo
  - crm
  - www
  - http
  - web
maintainers:
  - email: ferrenliu@163.com
    name: FerrenLiu
name: odoo-20
sources:
  - https://codeup.aliyun.com/inair/odoo-docker.git
  - https://www.odoo.com/
version: 8.0.0
